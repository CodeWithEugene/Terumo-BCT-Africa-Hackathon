<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Hanken Grotesk, Segoe UI, Arial, sans-serif" role="img" aria-label="Architecture of Providus"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#141B4D"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><rect x="30" y="30" width="250" height="70" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="44" y="56" font-size="15" font-weight="600" fill="#141B4D">Raw files (synthetic)</text><text x="44" y="76" font-size="11.5" fill="#595959">data/raw/*.csv · donor table never loaded</text><rect x="30" y="140" width="250" height="84" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="44" y="166" font-size="15" font-weight="600" fill="#141B4D">Pipeline</text><text x="44" y="186" font-size="11.5" fill="#595959">backend/pipeline · cleans, drops person columns,</text><text x="44" y="202" font-size="11.5" fill="#595959">scrambles unit labels, adds up requests</text><rect x="30" y="264" width="250" height="96" rx="9" fill="#D4EEF8" stroke="#141B4D" stroke-opacity="0.45"/><text x="44" y="290" font-size="15" font-weight="600" fill="#141B4D">Local database (SQLite)</text><text x="44" y="310" font-size="11.5" fill="#595959">data/app.db · system of record:</text><text x="44" y="326" font-size="11.5" fill="#595959">data tables, users, decisions, audit log</text><text x="44" y="342" font-size="11.5" fill="#595959">runs on one device, no internet needed</text><rect x="340" y="140" width="260" height="84" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="354" y="166" font-size="15" font-weight="600" fill="#141B4D">Forecasts</text><text x="354" y="186" font-size="11.5" fill="#595959">backend/engine · demand (baseline, model),</text><text x="354" y="202" font-size="11.5" fill="#595959">supply from the drive schedule</text><rect x="340" y="264" width="260" height="96" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="354" y="290" font-size="15" font-weight="600" fill="#141B4D">Stock projection and alerts</text><text x="354" y="310" font-size="11.5" fill="#595959">days of cover, range, status, reasons,</text><text x="354" y="326" font-size="11.5" fill="#595959">suggested order as a sum</text><text x="354" y="342" font-size="11.5" fill="#595959">falls back to the 4-week average if the model fails</text><rect x="660" y="264" width="250" height="96" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="674" y="290" font-size="15" font-weight="600" fill="#141B4D">API (FastAPI)</text><text x="674" y="310" font-size="11.5" fill="#595959">backend/api · sign-in, role scope,</text><text x="674" y="326" font-size="11.5" fill="#595959">decisions, audit log, fallback switch</text><text x="674" y="342" font-size="11.5" fill="#595959">security headers, password limit</text><rect x="660" y="400" width="250" height="84" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45"/><text x="674" y="426" font-size="15" font-weight="600" fill="#141B4D">Web app (React)</text><text x="674" y="446" font-size="11.5" fill="#595959">frontend · brief, detail, decisions,</text><text x="674" y="462" font-size="11.5" fill="#595959">regional, accuracy, privacy · offline cache</text><rect x="660" y="30" width="250" height="84" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45" stroke-dasharray="6 5"/><text x="674" y="56" font-size="15" font-weight="600" fill="#141B4D">Other systems</text><text x="674" y="76" font-size="11.5" fill="#595959">FHIR SupplyRequest (orders out)</text><text x="674" y="92" font-size="11.5" fill="#595959">DHIS2 dataValueSet (indicators out)</text><rect x="30" y="400" width="250" height="84" rx="9" fill="#ffffff" stroke="#141B4D" stroke-opacity="0.45" stroke-dasharray="6 5"/><text x="44" y="426" font-size="15" font-weight="600" fill="#141B4D">Central copy (optional)</text><text x="44" y="446" font-size="11.5" fill="#595959">backend/sync · Oracle Autonomous DB,</text><text x="44" y="462" font-size="11.5" fill="#595959">one way: aggregates, coded audit log</text><path d="M155 100V138" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M155 224V262" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M280 300C310 300 310 182 338 182" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M470 224V262" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M280 330H338" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M600 312H658" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M785 360V398" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)"/><path d="M785 262V116" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 5"/><path d="M155 360V398" fill="none" stroke="#141B4D" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 5"/><text x="340" y="420" font-size="12" fill="#595959">Solid arrows: the working path, all on one device.</text><text x="340" y="440" font-size="12" fill="#595959">Dashed: optional links to other systems.</text><text x="340" y="460" font-size="12" fill="#595959">A person accepts, changes or rejects every suggestion;</text><text x="340" y="480" font-size="12" fill="#595959">the decision goes back into the local database.</text></svg>