# Settings staff can change without touching code.

forecast:
  horizon_days: 14
  baseline_weeks: 4                 # the "usual way": same weekday over this many past weeks
  common_groups: ["O+", "A+", "B+"] # every other group is reported as "rare"

backtest:
  first_origin: 2026-07-06          # weekly origins (Mondays), both ends included
  last_origin: 2026-10-19

# --- Alerts -------------------------------------------------------------------
alerts:
  order_lead_days: 1            # an order placed today can change deliveries from tomorrow on
  delivery_learning_weeks: 8    # weeks used to learn the usual quantity of a delivery
  delivery_day_min_share: 0.5   # only used when a hospital has no delivery schedule on file
  act_shortfall_units: 1.0      # Act: expected to be at least this many units short before the next delivery
  empty_shelf_units_at_risk: 0.5  # Act: shelf will not last the emergency lead time and this much use is expected
  watch_shortfall_units: 1.0    # Watch: this many units short before the next delivery in a busy spell
  watch_horizon_shortfall_units: 1.0  # Watch: this many units short later in the 14 days
  watch_cover_days: 2.0         # Watch: cover under this many days (when use is expected)
  watch_min_weekly_use: 1.0     # ...and at least this many units expected in the next 7 days
  school_notice_days: 28        # mention a school break this many days ahead
  trend_min_change_pct: 20      # mention a change in requests only if at least this big
  trend_min_units: 4            # ...and at least this many units in one of the two periods
  baseline_rule_cover_days: 3.0 # the simple rule we compare against: cover under X days on the 28-day average
  event_window_days: 7          # alert check: was a request not fully met within this many days?

# --- Orders -------------------------------------------------------------------
orders:
  max_cover_days: 14            # never suggest more than this many days of expected use (limits wastage)

# Minimum stock per blood group, set by staff. No forecast can lower it.
# Stock under the minimum is at least "Watch", and suggested orders top up to it.
minimum_stock:
  RBC: {"O-": 2}
  FFP: {}

# --- Supply forecast (red cells and whole blood) ------------------------------------
supply:
  weeks_ahead: 4
  baseline_weeks: 4              # the "usual way": average of this many past weeks
  share_weeks: 8                 # weeks used for each hospital's share of its centre's deliveries
  max_testing_wait_days: 10
  unplanned_venues: [emergency_appeal]   # not known in advance, so never used as "scheduled"
  use_in_projection: true        # project hospital deliveries from the supply forecast

# --- Forecast model M1 -------------------------------------------------------------
model:
  rare_zero_week_share: 0.75     # a series is "rare" if this share of its last 26 weeks had no request
  rare_method: baseline          # how rare series are forecast: "baseline" or "model" (chosen before the test window; see docs/RESULTS.md)
  validation_origins: [2026-06-01, 2026-06-08, 2026-06-15, 2026-06-22]   # used only to choose rare_method
  max_iter: 150
  learning_rate: 0.06

# --- Fair-share allocation (red cells) ------------------------------------------------
allocation:
  demand_days: 28            # a hospital's need is its average daily requests over this many past days
  spare_cover_days: 7        # "spare" means units beyond this many days of a hospital's own use
  replay_first_day: 2026-07-06   # the replay covers the same period as the forecast tests
  # Protected minimum: before units are shared out, these kinds of hospital are first brought up to
  # this many days of cover. Used in the live proposal only. The replay in docs/RESULTS.md never
  # uses it, so the reported result is not tuned. Set to 0 to switch it off.
  protected_cover_days: 7
  protected_facility_types: [national_referral]

# --- Risk numbers shown beside each alert ---------------------------------------------
risk:
  simulations: 400               # demand paths drawn to estimate the chance of running out
  waste_high_units: 2            # wastage risk is "high" at this many units expected to expire in 14 days
  waste_watch_units: 1           # ... and "watch" at this many in a quiet spell
  stockout_cost: 5               # in the backtest, a unit short costs this many times a unit left over
  waste_cost: 1

# --- Platelets by apheresis (an assumption, not in the dataset) -------------------------
apheresis:
  whole_blood_units_per_apheresis_donation: 6   # one apheresis donation is taken as about 6 whole-blood-derived units
