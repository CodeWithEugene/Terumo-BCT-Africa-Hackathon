# Calendar settings for Kenya. To set the tool up for another country, copy this
# file, change the dates, and set "calendar_file" in config/site.yaml to the name of the copy.
#
# The dataset gives no exact dates. The school breaks below were read from the
# data (the days when no secondary-school blood drives took place) and match the
# dataset README: November to early January, April and August.
# Public holidays are the usual Kenyan dates. The two Eid dates depend on the
# moon and are approximate. Please confirm all dates before real use.

country: Kenya
first_date: 2025-09-01
last_date: 2027-01-31

school_breaks:            # first and last day of each break, both included
  - {name: Long holiday 2025,  start: 2025-10-24, end: 2026-01-04}
  - {name: Half term,          start: 2026-02-14, end: 2026-02-19}
  - {name: April holiday,      start: 2026-04-04, end: 2026-04-26}
  - {name: August holiday,     start: 2026-07-31, end: 2026-08-25}
  - {name: Long holiday 2026,  start: 2026-10-29, end: 2027-01-03}

# Breaks shorter than this many days are not counted as "the next school break"
# when we count down to it (a half term does not empty the donor pool for long).
min_break_days_for_countdown: 14

public_holidays:
  - {date: 2025-10-10, name: Mazingira Day}
  - {date: 2025-10-20, name: Mashujaa Day}
  - {date: 2025-12-12, name: Jamhuri Day}
  - {date: 2025-12-25, name: Christmas Day}
  - {date: 2025-12-26, name: Boxing Day}
  - {date: 2026-01-01, name: New Year's Day}
  - {date: 2026-03-20, name: Eid al-Fitr (approximate)}
  - {date: 2026-04-03, name: Good Friday}
  - {date: 2026-04-06, name: Easter Monday}
  - {date: 2026-05-01, name: Labour Day}
  - {date: 2026-05-27, name: Eid al-Adha (approximate)}
  - {date: 2026-06-01, name: Madaraka Day}
  - {date: 2026-10-10, name: Mazingira Day}
  - {date: 2026-10-20, name: Mashujaa Day}
  - {date: 2026-12-12, name: Jamhuri Day}
  - {date: 2026-12-25, name: Christmas Day}
  - {date: 2026-12-26, name: Boxing Day}
  - {date: 2027-01-01, name: New Year's Day}

# Months (1 to 12) of higher malaria transmission, by regional centre.
# Regions not listed have no malaria season flag.
malaria_season_months:
  RBTC-KSM: [5, 6, 7, 12, 1]     # Lake region
  RBTC-MSA: [5, 6, 7, 12]        # Coast
